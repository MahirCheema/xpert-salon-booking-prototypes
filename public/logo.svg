<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="appointifyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#appointifyGradient)" filter="url(#shadow)" />

  <!-- Calendar Top Binders -->
  <rect x="28" y="16" width="6" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.95" />
  <rect x="66" y="16" width="6" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Calendar Header Line -->
  <line x1="20" y1="34" x2="80" y2="34" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" />

  <!-- Calendar Inner Grid Dots / Mini Slots -->
  <circle cx="28" cy="44" r="3" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="44" cy="44" r="3" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="60" cy="44" r="3" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="76" cy="44" r="3" fill="#FFFFFF" fill-opacity="0.5" />

  <circle cx="28" cy="56" r="3" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="44" cy="56" r="3" fill="#FFFFFF" fill-opacity="0.5" />

  <!-- Stylized Clock Badge in Bottom Right -->
  <circle cx="68" cy="68" r="14" fill="#0F172A" fill-opacity="0.35" />
  <circle cx="68" cy="68" r="13" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-opacity="0.9" />
  <polyline points="68,60 68,68 74,68" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Confirmed Checkmark Swoosh -->
  <path d="M 28 62 L 44 76 L 82 32" fill="none" stroke="url(#checkGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
